
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A4 OFFICIAL MUSIC | Submit Your Song</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.png" type="image/png">
  <meta name="description" content="Submit your original music to A4 OFFICIAL MUSIC for consideration.">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: #fff;
      min-height: 100vh;
      padding: 30px 16px;
    }
    .container { max-width: 650px; margin: auto; }
    header { text-align: center; padding: 30px 10px; }
    .logo {
      color: #d6ad55;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .tagline { color: #aaa; margin-top: 10px; font-size: 13px; }
    .card {
      background: #141414;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 25px;
    }
    h1 { font-size: 25px; margin-bottom: 10px; }
    .intro { color: #aaa; line-height: 1.6; margin-bottom: 25px; font-size: 14px; }
    label { display: block; margin: 17px 0 8px; font-size: 14px; font-weight: bold; }
    input, textarea {
      width: 100%;
      padding: 14px;
      background: #090909;
      border: 1px solid #393939;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      outline: none;
    }
    input:focus, textarea:focus { border-color: #d6ad55; }
    input[type="file"] { font-size: 13px; }
    textarea { min-height: 120px; resize: vertical; }
    .hint { color: #888; font-size: 12px; margin-top: 7px; }
    button {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 8px;
      background: #d6ad55;
      color: #080808;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    #status { margin-top: 18px; text-align: center; font-size: 14px; line-height: 1.5; }
    footer { text-align: center; color: #777; font-size: 12px; padding: 25px 5px; }
    .required { color: #d6ad55; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">A4 OFFICIAL MUSIC</div>
      <div class="tagline">INDEPENDENT MUSIC • NEW TALENT • NEW SOUND</div>
    </header>

    <main class="card">
      <h1>Submit Your Song</h1>
      <p class="intro">
        Are you an independent artist or singer? Send us your original
        music for consideration. Fill in all details carefully.
      </p>

      <form id="submissionForm">
        <label>Artist / Singer Name <span class="required">*</span></label>
        <input type="text" id="artist" required maxlength="100"
          placeholder="Enter your artist name">

        <label>Email Address <span class="required">*</span></label>
        <input type="email" id="email" required maxlength="150"
          placeholder="Your email address">

        <label>Phone Number <span class="required">*</span></label>
        <input type="tel" id="phone" required maxlength="20"
          placeholder="Your contact number">

        <label>Upload Your Song <span class="required">*</span></label>
        <input type="file" id="audio" accept=".mp3,.wav,audio/mpeg,audio/wav" required>
        <p class="hint">Accepted formats: MP3 and WAV. Maximum size: 20 MB.</p>

        <label>Message <span class="required">*</span></label>
        <textarea id="message" required maxlength="2000"
          placeholder="Tell us about your song, genre, and anything else you want us to know."></textarea>

        <button type="submit" id="submitBtn">SUBMIT YOUR SONG</button>
        <div id="status" role="status"></div>
      </form>
    </main>

    <footer>
      © 2026 A4 OFFICIAL MUSIC. All rights reserved.
    </footer>
  </div>

  <script>
    // Add your NEW Supabase project's details here.
    const SUPABASE_URL = "https://nfhygairspjpjpuqpegs.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_hlN1ekYd5VPGo2SmajDcLQ_n1FkkrWe";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const form = document.getElementById("submissionForm");
    const button = document.getElementById("submitBtn");
    const statusBox = document.getElementById("status");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const artist = document.getElementById("artist").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const message = document.getElementById("message").value.trim();
      const file = document.getElementById("audio").files[0];

      if (!file) {
        statusBox.textContent = "Please select your song.";
        return;
      }

      const allowedTypes = ["audio/mpeg", "audio/wav", "audio/x-wav"];
      const extension = file.name.split(".").pop().toLowerCase();

      if (!["mp3", "wav", "flac"].includes(extension)) {
        statusBox.textContent = "Only MP3 and WAV files are accepted.";
        return;
      }

      if (file.size > 50 * 1024 * 1024) {
        statusBox.textContent = "Your audio file must be under 50 MB.";
        return;
      }

      if (!SUPABASE_URL.startsWith("https://") ||
          SUPABASE_ANON_KEY.includes("YOUR_")) {
        statusBox.textContent = "Website setup is not complete yet.";
        return;
      }

      button.disabled = true;
      button.textContent = "SUBMITTING...";
      statusBox.textContent = "Please wait. Uploading your song...";

      try {
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        const filePath = Date.now() + "_" +
          Math.random().toString(36).slice(2) + "_" + safeName;

        const { error: uploadError } = await supabaseClient.storage
          .from("song-pitches")
          .upload(filePath, file, { upsert: false });

        if (uploadError) throw uploadError;

        const { error: insertError } = await supabaseClient
          .from("song_submissions")
          .insert([{
            artist_name: artist,
            email: email,
            phone: phone,
            message: message,
            audio_path: filePath
          }]);

        
if (insertError) throw insertError;

// Send email notification
const { error: notificationError } =
  await supabaseClient.functions.invoke(
    "send-song-notification",
    {
      body: {
        artist_name: artist,
        email: email,
        phone: phone,
        message: message,
        audio_path: filePath
      }
    }
  );

if (notificationError) {
  console.error("Email notification failed:", notificationError);
  statusBox.textContent =
    "Song submitted successfully, but email notification failed.";
} else {
  statusBox.textContent =
    "Thank you! Your song has been submitted successfully.";
}

form.reset();
            

      } catch (error) {
        console.error(error);
        statusBox.textContent =
          "Submission failed. Please try again later.";
      } finally {
        button.disabled = false;
        button.textContent = "SUBMIT YOUR SONG";
      }
    });
  </script>
</body>
  </html>
